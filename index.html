<style>
:root{--bg:#0c0e13;--sf:#12151d;--cd:#171b26;--bd:#1f2535;--ac:#e8c840;--ok:#4af0b0;--rd:#f0504a;--wn:#f09040;--tx:#e8eaf0;--mu:#8a94aa;--jk:#a078f0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Mono',monospace}
body{min-height:100vh}
body.blink{animation:bl .8s infinite}@keyframes bl{50%{box-shadow:inset 0 0 0 6px rgba(240,80,74,.5)}}

.w{width:100%;max-width:900px}

.pn{background:var(--cd);border:1px solid var(--bd);border-top:2px solid var(--ac);padding:2rem;margin-bottom:1.2rem}
.b{font-family:Syne,sans-serif;font-weight:800;font-size:1rem;border:0;cursor:pointer;padding:.9rem 2rem;background:var(--ac);color:#0c0e13;margin:0 .6rem .6rem 0}
.b:hover{filter:brightness(1.1)}.g{background:none;color:var(--ac);border:1px solid var(--ac)}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.6rem;margin-bottom:1rem}
.ns{display:flex;gap:.5rem;background:var(--sf);border:1px solid var(--bd);padding:.5rem .7rem;color:var(--mu);font-size:.7rem}
.ni{background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:.9rem;width:100%}
.ch{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:1.5rem 0 2.5rem}
.c{font-size:.85rem;padding:.3rem .8rem;border:1px solid var(--bd);background:var(--sf);color:var(--mu)}.c.d{opacity:.3;text-decoration:line-through}
.big{font-size:1.3rem;padding:1.2rem 3rem}
.cl{display:flex;gap:1rem;align-items:center;border:1px solid var(--ac);background:var(--cd);padding:1rem 1.4rem;margin-bottom:1.2rem;font-family:Syne,sans-serif;font-weight:800;font-size:1.5rem;color:var(--ac)}
.cl small{display:block;font:400 .8rem 'IBM Plex Mono',monospace;color:var(--mu)}

.rb{fill:none;stroke:var(--bd);stroke-width:5}.rf{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
#rn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 1.7rem Syne,sans-serif}
.tl{font-size:.7rem;letter-spacing:.12em;color:var(--mu);margin-bottom:.4rem}
.br{height:5px;background:var(--bd);border-radius:3px;overflow:hidden;width:min(500px,60vw)}#bar{height:100%;background:var(--ok);transition:width .9s linear}
.bg{font-size:.7rem;padding:.2rem .6rem;border:1px solid;display:inline-block;margin:0 .5rem 1rem 0}
.dm{color:var(--ac)}.ds{color:var(--wn)}.dx{color:var(--rd)}
.q{font-family:Syne,sans-serif;font-weight:600;font-size:clamp(1.2rem,2.6vw,1.7rem);line-height:1.5;margin-bottom:1.6rem}
.os{display:flex;flex-direction:column;gap:.7rem}
.o{display:flex;gap:1rem;text-align:left;background:var(--sf);border:1px solid var(--bd);color:var(--tx);font:inherit;font-size:1.05rem;line-height:1.5;padding:1rem 1.2rem;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}.o i{font-style:normal;flex:none;width:1.6rem;height:1.6rem;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--mu)}
.o.ok{border-color:var(--ok);background:rgba(74,240,176,.1)}.o.no{border-color:var(--rd);background:rgba(240,80,74,.1)}.o.gone{opacity:.15}.o:disabled{cursor:default}
.ex{display:none;margin-top:1.4rem;padding:1.1rem 1.3rem;font-size:.95rem;line-height:1.7;border-left:3px solid var(--ok);background:rgba(74,240,176,.07)}
.ex.on{display:block}.ex.bad{border-color:var(--ac);background:rgba(232,200,64,.08)}.ex b{color:var(--ok)}.ex.bad b{color:var(--ac)}
.jk{display:none;gap:1.2rem;align-items:center;flex-wrap:wrap;background:rgba(160,120,240,.12);border:1px solid var(--jk);padding:1.1rem 1.4rem;margin-bottom:1.2rem}.jk.on{display:flex}
.jk .ic{font-size:2rem}.jk div{flex:1;min-width:200px}.jk h3{font-family:Syne,sans-serif;color:var(--jk);font-size:1.15rem}.jk p{font-size:.85rem;color:var(--mu)}
.jb{background:var(--jk);color:#fff}
.hp{display:none;text-align:center;border:2px solid var(--jk);background:rgba(160,120,240,.12);padding:1.5rem;margin-bottom:1.2rem}.hp.on{display:block}
.hp h2{font-family:Syne,sans-serif;font-size:1.6rem;color:var(--jk)}.hp strong{display:block;font:800 3rem Syne,sans-serif;margin:.4rem 0}
.ft{display:none;margin-top:1.4rem}.ft.on{display:block}
.ar{margin-bottom:1.1rem;padding:1.1rem;background:var(--cd);border:1px solid var(--bd)}.ar p{font-size:.85rem;line-height:1.6;margin:.2rem 0}.ar .k{color:var(--ok)}.ar .m{color:var(--mu);font-size:.75rem}
h2.ah{font-family:Syne,sans-serif;color:var(--ac);margin:1.6rem 0 .8rem;font-size:1.3rem}
</style></head><body>

<script>
const $=id=>document.getElementById(id),R=n=>Math.floor(Math.random()*n);
const AR={G:'GVP-Tarifwerk',A:'AÜG',B:'BUrlG',Z:'ArbZG'},DF={m:'Mittel',s:'Schwer',x:'Sehr schwer'};
const P=[],Q=(a,d,q,c,w,e,s,l)=>P.push({a,d,q,c,w,e,s,l});
const GV='GVP-Tarifwerk Stand Januar 2026, ';
// GVP
Q('G','m','Wie viele Urlaubstage stehen nach dem MTV DGB/GVP im ersten Jahr der Betriebszugehörigkeit zu?','25 Arbeitstage',['24 Arbeitstage','27 Arbeitstage','30 Arbeitstage'],'1. Jahr 25, 2. und 3. Jahr 27, ab dem 4. Jahr 30 Arbeitstage.',GV+'MTV § 9.3, S. 12');
Q('G','m','Wie hoch ist die regelmäßige monatliche Arbeitszeit Vollzeitbeschäftigter nach MTV, und bis zu welcher Wochenstundenzahl darf im Einzelfall vertraglich abgewichen werden?','151,67 Std. (35 Std. pro Woche); Abweichung bis max. 40 Std. pro Woche',['160 Std. (37,5 Std. pro Woche); Abweichung bis max. 45 Std. pro Woche','151,67 Std. (35 Std. pro Woche); Abweichung bis max. 42 Std. pro Woche','165 Std. (38 Std. pro Woche); Abweichung bis max. 40 Std. pro Woche'],'Abweichung nur in begründeten Einzelfällen bei überwiegendem Einsatz in Kundenbetrieben mit längerer Arbeitszeit; 40 Std. entsprechen 173,34 Std. im Monat.',GV+'MTV § 3.1, S. 5',1);
Q('G','s','Wie viele Plusstunden darf das Arbeitszeitkonto regulär maximal umfassen, und ab welchem Guthaben muss der Arbeitgeber gegen Insolvenz sichern?','Max. 200 Plusstunden; Insolvenzsicherung ab 150 Std.',['Max. 150 Plusstunden; Insolvenzsicherung ab 100 Std.','Max. 230 Plusstunden; Insolvenzsicherung ab 200 Std.','Max. 200 Plusstunden; Insolvenzsicherung ab 91 Std.'],'Saisonal im Einzelfall bis 230. Ohne Nachweis der Insolvenzsicherung max. 150 Std. Die 91 Std. sind die Grenze für die Auszahlung auf Verlangen (§ 4.4 f).',GV+'MTV § 4.2, S. 6 bis 8',1);
Q('G','s','Welche Ausschlussfristen gelten nach § 13 MTV?','3 Monate ab Fälligkeit in Textform; nach Ablehnung weitere 3 Monate für die gerichtliche Geltendmachung',['3 Monate ab Fälligkeit in Schriftform; nach Ablehnung weitere 2 Monate für die gerichtliche Geltendmachung','6 Monate ab Fälligkeit in Textform; nach Ablehnung weitere 3 Monate für die gerichtliche Geltendmachung','3 Monate ab Fälligkeit in Textform; nach Ablehnung gilt nur noch die gesetzliche Verjährung'],'Nicht fristgerecht geltend gemachte Ansprüche sind ausgeschlossen.',GV+'MTV § 13, S. 17',1);
Q('G','x','Wie wirkt sich eine Unterbrechung des Einsatzes beim selben Kunden auf den Erfahrungszuschlag aus, und wie hoch ist er nach 9 bzw. 12 Monaten?','Unterbrechung bis 3 Monate: Zeiten werden angerechnet; 1,5 % nach 9 und 3,0 % nach 12 Monaten',['Jede Unterbrechung setzt neu an; 1,5 % nach 9 und 3,0 % nach 12 Monaten','Unterbrechung bis 3 Monate: Zeiten werden angerechnet; 2,0 % nach 9 und 4,0 % nach 12 Monaten','Unterbrechung bis 6 Monate: Zeiten werden angerechnet; 1,5 % nach 9 und 3,0 % nach 12 Monaten'],'Erstmals gezahlt wird der Zuschlag nach 12 Kalendermonaten ununterbrochenem Bestehen des Arbeitsverhältnisses.',GV+'ETV § 3, S. 27 und 28',1);
Q('G','x','Welche Übergangsregelung gilt für ehemalige iGZ-Mitglieder anstelle des Erfahrungszuschlags, und bis wann?','Einsatzbezogene Zulage (0,20 € für EG 1 bis 4, 0,35 € für EG 5 bis 9 je Std.), befristet bis 30.06.2027',['Einsatzbezogene Zulage (0,35 € für EG 1 bis 4, 0,20 € für EG 5 bis 9 je Std.), befristet bis 30.06.2027','Einsatzbezogene Zulage (0,20 € für EG 1 bis 4, 0,35 € für EG 5 bis 9 je Std.), befristet bis 31.12.2029','Pauschale Zulage von 0,50 € je Std. für alle Entgeltgruppen, befristet bis 30.06.2027'],'Zulage nach 9 Monaten Überlassung an denselben Kunden, erstmals nach 14 Monaten Arbeitsverhältnis. Der Arbeitgeber darf früher auf § 3 ETV wechseln.',GV+'ETV § 3 und Übergangsregelung, S. 27 und 40',1);
// AÜG
Q('A','m','Wie lang ist die gesetzliche Überlassungshöchstdauer, und ab welcher Unterbrechung beginnt sie neu?','18 Monate; neu nach einer Unterbrechung von mehr als 3 Monaten',['18 Monate; neu nach einer Unterbrechung von mehr als 6 Wochen','24 Monate; neu nach einer Unterbrechung von mehr als 3 Monaten','12 Monate; neu nach einer Unterbrechung von mehr als 3 Monaten'],'Tarifverträge der Einsatzbranche können abweichen.','AÜG § 1 Abs. 1b');
Q('A','m','Wozu hat ein Leiharbeitnehmer nach § 13b AÜG Zugang beim Entleiher?','Zu Gemeinschaftseinrichtungen und -diensten wie Kantine oder Kinderbetreuung, wie die Stammbelegschaft',['Nur zu den Sozialräumen, nicht zur Kantine','Zu den Sitzungen des Betriebsrats als Gast','Zu allen freiwilligen Leistungen des Entleihers, z. B. Weihnachtsgeld'],'Eine Ungleichbehandlung ist nur aus sachlichen Gründen zulässig.','AÜG § 13b');
Q('A','s','Nach wie vielen Monaten muss spätestens Equal Pay gezahlt werden, und bis wann können Branchenzuschläge stufenweise heranführen?','Nach 9 Monaten; Branchenzuschläge führen stufenweise bis spätestens 15 Monate heran',['Nach 6 Monaten; Branchenzuschläge führen stufenweise bis spätestens 12 Monate heran','Nach 12 Monaten; Branchenzuschläge führen stufenweise bis spätestens 18 Monate heran','Nach 9 Monaten; Branchenzuschläge führen stufenweise bis spätestens 24 Monate heran'],'Die erste Stufe muss nach spätestens 6 Wochen Einarbeitung greifen.','AÜG § 8 Abs. 4',1);
Q('A','s','Darf ein Entleiher Leiharbeitnehmer in einem unmittelbar bestreikten Betrieb einsetzen?','Nein; Leiharbeitnehmer dürfen das Tätigwerden dort verweigern (Streikbrecherverbot)',['Ja, wenn der Verleiher zustimmt','Ja, aber nur auf ihren bisherigen Arbeitsplätzen','Ja, wenn der Arbeitsvertrag älter als 6 Monate ist'],'Ergänzend regelt § 15 MTV, dass Einsätze im Umfang eines Streikaufrufs unterbleiben.','AÜG § 11 Abs. 5; MTV § 15, S. 19');
Q('A','x','Welche Folge hat es, wenn die Überlassungshöchstdauer überschritten wird?','Überlassungsvertrag unwirksam; Arbeitsverhältnis zum Entleiher wird fingiert, außer bei Festhaltenserklärung',['Nur ein Bußgeld gegen den Verleiher; die Verträge bleiben wirksam','Das Arbeitsverhältnis zum Verleiher endet automatisch','Der Leiharbeitnehmer erhält lediglich Equal Pay rückwirkend'],'Die Festhaltenserklärung muss innerhalb eines Monats abgegeben werden.','AÜG §§ 9, 10',1);
Q('A','x','Welche Pflicht trifft Verleiher und Entleiher nach § 1 Abs. 1 Satz 5 und 6 AÜG vor der Überlassung?','Überlassung ausdrücklich als solche bezeichnen und den Leiharbeitnehmer vorab namentlich konkretisieren',['Überlassung vier Wochen vorher bei der Agentur für Arbeit anzeigen und den Namen später nennen','Überlassung im Betrieb aushängen und alle Stammkräfte benennen','Überlassung nur mündlich vereinbaren und den Namen nach 9 Monaten nennen'],'Verstöße führen zur Unwirksamkeit und zur Fiktion nach § 10 AÜG.','AÜG § 1 Abs. 1 S. 5, 6',1);
// BUrlG
Q('B','m','Wie viele Werktage beträgt der gesetzliche Mindesturlaub nach § 3 BUrlG bei einer 6-Tage-Woche?','24 Werktage (20 Arbeitstage bei 5-Tage-Woche)',['20 Werktage (16 Arbeitstage bei 5-Tage-Woche)','28 Werktage (23 Arbeitstage bei 5-Tage-Woche)','30 Werktage (25 Arbeitstage bei 5-Tage-Woche)'],'Der Tarifurlaub nach MTV liegt mit 25 bis 30 Arbeitstagen darüber.','BUrlG § 3');
Q('B','m','Wann entsteht der volle Urlaubsanspruch erstmals?','Nach 6 Monaten Bestehen des Arbeitsverhältnisses',['Nach 3 Monaten','Nach 12 Monaten','Sofort mit Arbeitsbeginn'],'Das ist die Wartezeit nach § 4 BUrlG.','BUrlG § 4');
Q('B','s','Welcher Zeitraum bestimmt nach § 11 BUrlG das Urlaubsentgelt?','Durchschnittsverdienst der letzten 13 Wochen vor Urlaubsbeginn, ohne Überstundenvergütung',['Durchschnitt der letzten 12 Monate inklusive Überstunden','Verdienst des letzten Monats vor Urlaubsbeginn','Durchschnitt der letzten 26 Wochen inklusive Überstunden'],'Der MTV § 10 nutzt dagegen die letzten 3 abgerechneten Monate.','BUrlG § 11; MTV § 10, S. 14',1);
Q('B','s','Ein Arbeitnehmer scheidet zum 30.04. aus, die Wartezeit ist erfüllt. Wie viel Urlaub steht nach BUrlG zu?','4/12 des Jahresurlaubs (1/12 je vollem Monat)',['Der volle Jahresurlaub','Kein Urlaub mehr, da die Jahreshälfte nicht erreicht ist','Der gesetzliche Mindesturlaub in voller Höhe'],'Scheidet man nach erfüllter Wartezeit in der ersten Jahreshälfte aus, besteht Teilurlaub.','BUrlG § 5 Abs. 1 lit. c');
Q('B','x','Wann verfällt Resturlaub nach der Rechtsprechung von EuGH und BAG zum 31.12. bzw. 31.03.?','Nur wenn der Arbeitgeber den Arbeitnehmer rechtzeitig konkret zur Urlaubnahme aufgefordert und auf den Verfall hingewiesen hat',['Immer automatisch zum 31.03. des Folgejahres','Nur wenn der Arbeitnehmer den Urlaub schriftlich beantragt hat','Nie, Urlaub verfällt nach der Rechtsprechung nicht mehr'],'Mitwirkungsobliegenheit des Arbeitgebers, BAG vom 19.02.2019 (9 AZR 423/16).','BUrlG § 7 Abs. 3',1);
Q('B','x','Ein Arbeitnehmer tritt zum 01.10. ein, die Wartezeit ist zum Jahresende nicht erfüllt. Was gilt für den Teilurlaub?','Auf Verlangen des Arbeitnehmers ist er auf das nächste Kalenderjahr zu übertragen',['Er verfällt zum 31.12. ersatzlos','Er wird zwingend ausgezahlt','Er wird nur bei Zustimmung des Arbeitgebers übertragen'],'Sonderregel für den Teilurlaub nach § 5 Abs. 1 lit. a.','BUrlG § 7 Abs. 3 S. 4');
// ArbZG
Q('Z','m','Welche Mindestruhepause steht bei mehr als 6 bis zu 9 Stunden Arbeitszeit zu?','30 Minuten',['15 Minuten','45 Minuten','60 Minuten'],'Über 9 Stunden sind es 45 Minuten; Pausen müssen mindestens 15 Minuten lang sein.','ArbZG § 4');
Q('Z','m','Wie lang muss die ununterbrochene Ruhezeit nach Arbeitsende mindestens sein?','11 Stunden',['8 Stunden','10 Stunden','12 Stunden'],'Kürzung nur in Ausnahmebranchen mit Ausgleich.','ArbZG § 5');
Q('Z','s','Bis wie viele Stunden darf die werktägliche Arbeitszeit ausgedehnt werden, und in welchem Zeitraum muss der Ausgleich auf durchschnittlich 8 Stunden erfolgen?','Bis 10 Stunden; Ausgleich innerhalb von 6 Kalendermonaten oder 24 Wochen',['Bis 12 Stunden; Ausgleich innerhalb von 6 Kalendermonaten oder 24 Wochen','Bis 10 Stunden; Ausgleich innerhalb von 4 Wochen','Bis 10 Stunden; Ausgleich innerhalb von 12 Monaten'],'Für Nachtarbeitnehmer gilt ein kürzerer Ausgleichszeitraum (1 Kalendermonat oder 4 Wochen).','ArbZG § 3, § 6 Abs. 2',1);
Q('Z','s','Wie lange sind Aufzeichnungen über Arbeitszeit über 8 Stunden nach § 16 Abs. 2 ArbZG aufzubewahren?','2 Jahre',['1 Jahr','3 Jahre','6 Jahre'],'Zusätzlich folgt aus dem BAG-Beschluss von 2022 eine Pflicht zur Erfassung der gesamten Arbeitszeit.','ArbZG § 16 Abs. 2');
Q('Z','x','Ab wie vielen Nachtarbeitstagen im Kalenderjahr gilt man (neben Wechselschicht) als Nachtarbeitnehmer?','48 Tage',['30 Tage','60 Tage','90 Tage'],'Nachtzeit ist 23 bis 6 Uhr; Nachtarbeit liegt vor, wenn mehr als 2 Stunden in die Nachtzeit fallen.','ArbZG § 2 Abs. 3 bis 5');
Q('Z','x','Innerhalb welchen Zeitraums muss ein Ersatzruhetag für Sonntagsarbeit bzw. Feiertagsarbeit gewährt werden?','Sonntag: 2 Wochen; Feiertag: 8 Wochen',['Sonntag: 4 Wochen; Feiertag: 8 Wochen','Sonntag: 2 Wochen; Feiertag: 12 Wochen','Sonntag: 1 Woche; Feiertag: 4 Wochen'],'Außerdem müssen mindestens 15 Sonntage im Jahr beschäftigungsfrei bleiben.','ArbZG § 11 Abs. 1 und 3');

let names=[],rem=[],used=new Set(),cur,who,T,HT,left,total,frozen,fin,jUsed,jk;
function go(id){document.querySelectorAll('.s').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}
function addSlot(f){const g=$('ng'),d=document.createElement('div');d.className='ns';d.innerHTML='<span>'+(g.children.length+1)+'</span><input class="ni" maxlength="20" placeholder="Name">';g.appendChild(d);const i=d.querySelector('input');i.onkeydown=e=>{if(e.key==='Enter'){const n=d.nextElementSibling;n?n.querySelector('input').focus():addSlot(1)}};if(f)i.focus()}
function clr(){document.querySelectorAll('.ni').forEach(i=>i.value='')}
for(let i=0;i<15;i++)addSlot();
function startGame(){names=[...document.querySelectorAll('.ni')].map(i=>i.value.trim()).filter(Boolean);if(names.length<2)return alert('Bitte mindestens 2 Namen eintragen.');if(names.length>P.length)return alert('Maximal '+P.length+' Personen, so viele Fragen gibt es im Pool.');resetAll()}
function resetAll(){rem=[...names];used.clear();lobby()}
function lobby(){const n=names.length,d=n-rem.length;$('lt').textContent=d?'Weiter geht’s!':'Bereit?';$('lc').textContent=rem.length+' von '+n+' Personen stehen noch aus';$('ch').innerHTML=names.map(x=>'<span class="c'+(rem.includes(x)?'':' d')+'">'+x+'</span>').join('');go('lobby')}
function toLobby(){clearInterval(T);clearInterval(HT);document.body.classList.remove('blink');rem.length?lobby():go('done')}
function pickQ(){const f=P.map((_,i)=>i).filter(i=>!used.has(i)),i=f[R(f.length)];used.add(i);cur=P[i]}
function draw(){if(!rem.length)return go('done');who=rem.splice(R(rem.length),1)[0];pickQ();load(0);go('q')}
function sh(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
